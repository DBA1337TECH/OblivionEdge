name: CodeQL Scan

on:
  push:
    branches: [ OblivionEdge_Dev ]
  pull_request:
    branches: [ OblivionEdge_Dev ]
  schedule:
    - cron: '0 2 * * 0'   # Weekly (Sundays 02:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: speed up Rust builds
      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'rust,cpp,python,ruby'
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: 'security'
          upload: false           # keep alerts off until we upload SARIF ourselves
          output: sarif-results   # writes SARIF files into this path

      - name: Upload SARIF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: sarif-results/**/*.sarif

